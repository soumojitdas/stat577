<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Backpropagation Walkthrough | STAT 577</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root {
    --bg: #f5f0e8; --surface: #ebe5da; --card: #ffffff; --border: #d4cbbe;
    --text: #2c2418; --dim: #7a7060; --accent: #b35c1e;
    --red: #c0392b; --blue: #2471a3; --green: #1a7a5a;
    --orange: #c67016; --purple: #7c3aed;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Georgia','Charter',serif; background: var(--bg); color: var(--text); padding: 28px 20px; }
  .container { max-width: 1150px; margin: 0 auto; }
  h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 3px; }
  .subtitle { font-size: 0.82rem; color: var(--dim); margin-bottom: 18px; font-family: system-ui,sans-serif; }

  /* Graph canvas */
  .graph-wrap { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; overflow: hidden; }
  canvas { display: block; width: 100%; height: 500px; border-radius: 8px; }
  #overlays .katex { font-size: inherit !important; }

  /* Step controls */
  .controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 12px; flex-wrap: wrap; }
  .step-indicator { display: flex; gap: 0; align-items: flex-end; flex-wrap: wrap; }
  .step-group {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .step-group-label {
    font-family: system-ui,sans-serif; font-size: 0.62rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: 1px; color: var(--dim);
  }
  .step-group-label.fwd { color: var(--blue); }
  .step-group-label.bwd { color: var(--red); }
  .step-group-dots { display: flex; gap: 4px; align-items: center; }
  .step-dot {
    width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Courier New',monospace; font-size: 0.75rem; cursor: pointer;
    transition: all 0.15s; background: var(--card); color: var(--dim);
  }
  .step-dot.active { background: var(--accent); color: white; border-color: var(--accent); font-weight: 700; }
  .step-dot.forward { border-color: var(--blue); }
  .step-dot.forward.active { background: var(--blue); border-color: var(--blue); }
  .step-dot.backward { border-color: var(--red); }
  .step-dot.backward.active { background: var(--red); border-color: var(--red); }
  .step-dot.done { border-color: var(--green); }
  .step-dot.done.active { background: var(--green); border-color: var(--green); }
  .step-sep { color: var(--border); font-size: 1.2rem; margin: 0 6px; user-select: none; align-self: flex-end; padding-bottom: 4px; }

  .nav-btn {
    font-family: system-ui,sans-serif; font-size: 0.85rem; font-weight: 700;
    padding: 9px 22px; border-radius: 9px; cursor: pointer; border: none;
    background: var(--accent); color: white; transition: opacity 0.15s;
  }
  .nav-btn:disabled { background: var(--border); color: var(--dim); cursor: default; }

  /* Detail panel */
  .detail { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 22px; border-left: 5px solid var(--accent); }
  .detail h2 { font-size: 1.1rem; font-weight: 700; margin-bottom: 10px; }
  .detail .phase-badge {
    display: inline-block; font-size: 0.7rem; font-family: system-ui,sans-serif;
    padding: 2px 10px; border-radius: 12px; font-weight: 600; margin-left: 8px; vertical-align: middle;
  }
  .math-block {
    background: var(--bg); border-radius: 8px; padding: 14px 18px; margin: 12px 0;
    border-left: 3px solid var(--accent); text-align: center; overflow-x: auto;
  }
  .detail p { font-size: 0.9rem; line-height: 1.7; margin-bottom: 8px; }
  .detail .insight {
    background: var(--accent); color: white; border-radius: 8px; padding: 10px 14px;
    font-family: system-ui,sans-serif; font-size: 0.82rem; line-height: 1.5; margin-top: 10px;
  }
  .detail .insight strong { color: #fff; }

  /* Stored values panel */
  .stored {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 18px; font-family: 'Courier New',monospace; font-size: 0.8rem;
    display: grid; grid-template-columns: 1fr; gap: 4px;
    min-width: 0;
  }
  .stored .katex { font-size: 0.88em !important; }
  .stored-title {
    grid-column: 1/-1; font-family: system-ui,sans-serif; font-size: 0.72rem;
    text-transform: uppercase; letter-spacing: 0.8px; color: var(--dim); margin-bottom: 4px; font-weight: 600;
  }
  .stored .item { display: flex; justify-content: space-between; align-items: baseline; padding: 4px 0; gap: 8px; min-width: 0; }
  .stored .lbl { color: var(--dim); min-width: 0; flex-shrink: 1; }
  .stored .val { color: var(--text); font-weight: 600; flex-shrink: 0; }
  .stored .val.new { color: var(--accent); }
  .stored .val.back { color: var(--red); }
  .stored .item.highlight { animation: flash-in 0.5s ease-out; }
  @keyframes flash-in {
    0% { background: var(--accent); color: white; border-radius: 4px; }
    100% { background: transparent; }
  }
  .stored .item.highlight-back { animation: flash-in-back 0.5s ease-out; }
  @keyframes flash-in-back {
    0% { background: var(--red); color: white; border-radius: 4px; }
    100% { background: transparent; }
  }

  /* Responsive: stack detail + stored on narrow screens */
  @media (max-width: 820px) {
    .bottom-grid { grid-template-columns: 1fr !important; }
    .stored { order: -1; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>Backpropagation — Step by Step</h1>
  <div class="subtitle">STAT 577 · A 2→2→1 network with concrete numbers. Watch values flow forward, then errors flow backward.</div>

  <div class="graph-wrap" style="position:relative;">
    <canvas id="graph" width="1100" height="500"></canvas>
    <div id="overlays" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;"></div>
  </div>

  <div class="controls">
    <button class="nav-btn" id="prev" disabled>← Back</button>
    <div class="step-indicator" id="dots"></div>
    <button class="nav-btn" id="next">Next →</button>
  </div>

  <div class="bottom-grid" style="display:grid; grid-template-columns:1fr 340px; gap:16px; align-items:start;">
    <div class="detail" id="detail"></div>
    <div class="stored" id="stored"></div>
  </div>
</div>

<script>
// ── Network weights (fixed for the demo) ──
const W = {
  a11: 0.6, a12: -0.3, a10: 0.1,
  a21: 0.4, a22: 0.8, a20: -0.2,
  b1: 0.9, b2: -0.5, b0: 0.1
};
const x1 = 1.0, x2 = 0.5, yTrue = 1.0;

// ── Forward computations ──
const v1 = W.a11*x1 + W.a12*x2 + W.a10;
const v2 = W.a21*x1 + W.a22*x2 + W.a20;
const sig = v => 1/(1+Math.exp(-v));
const Z1 = sig(v1);
const Z2 = sig(v2);
const f = W.b1*Z1 + W.b2*Z2 + W.b0;
const R = 0.5*(yTrue - f)**2;

// ── Backward computations ──
const delta = -(yTrue - f);
const dR_db1 = delta * Z1;
const dR_db2 = delta * Z2;
const dR_db0 = delta;
const sigp = v => sig(v)*(1-sig(v));
const s1 = sigp(v1) * W.b1 * delta;
const s2 = sigp(v2) * W.b2 * delta;
const dR_da11 = s1 * x1;
const dR_da12 = s1 * x2;
const dR_da10 = s1;
const dR_da21 = s2 * x1;
const dR_da22 = s2 * x2;
const dR_da20 = s2;

const fmt = (v,d=4) => v.toFixed(d);

// ── Step definitions ──
const steps = [
  {
    title: "The Setup",
    phase: "setup", phaseColor: "var(--accent)",
    tex: `\\text{Inputs: } x_1 = ${x1},\\; x_2 = ${x2},\\; y = ${yTrue} \\\\[4pt] \\text{Hidden weights: } \\alpha_{11}=0.6,\\; \\alpha_{12}=-0.3,\\; \\alpha_{21}=0.4,\\; \\alpha_{22}=0.8 \\\\[4pt] \\text{Biases: } \\alpha_{10}=0.1,\\; \\alpha_{20}=-0.2,\\; \\beta_0=0.1 \\qquad \\text{Output weights: } \\beta_1=0.9,\\; \\beta_2=-0.5`,
    text: "We have a tiny network: 2 inputs, 2 hidden neurons (sigmoid), 1 linear output. All weights and biases are chosen arbitrarily for illustration — in real training, they'd start as small random values (He or Xavier initialization) and get updated by SGD.",
    insight: "The weights are: $\\alpha_{11}=0.6$, $\\alpha_{12}=-0.3$, $\\alpha_{21}=0.4$, $\\alpha_{22}=0.8$, $\\beta_1=0.9$, $\\beta_2=-0.5$. The biases are: $\\alpha_{10}=0.1$, $\\alpha_{20}=-0.2$, $\\beta_0=0.1$. Biases play the same role as the intercept $\\beta_0$ in regression — they shift the decision boundary away from the origin.",
    highlight: ["x1","x2"],
    stored: {}
  },
  {
    title: "Forward: Pre-activations",
    phase: "forward", phaseColor: "var(--blue)",
    tex: `v_1 = ${W.a11}(${x1}) + (${W.a12})(${x2}) + ${W.a10} = ${fmt(v1)}\\\\v_2 = ${W.a21}(${x1}) + ${W.a22}(${x2}) + (${W.a20}) = ${fmt(v2)}`,
    text: "Compute the weighted sum at each hidden neuron BEFORE applying the activation function. We store these $v$ values — we'll need $\\sigma'(v)$ in the backward pass.",
    insight: "We STORE $v_1$ and $v_2$. The backward pass needs them to compute $\\sigma'(v)$.",
    highlight: ["x1","x2","v1","v2"],
    stored: { "$v_1$": fmt(v1), "$v_2$": fmt(v2) }
  },
  {
    title: "Forward: Hidden Activations",
    phase: "forward", phaseColor: "var(--blue)",
    tex: `Z_1 = \\sigma(${fmt(v1)}) = ${fmt(Z1)}\\\\Z_2 = \\sigma(${fmt(v2)}) = ${fmt(Z2)}`,
    text: "Apply the sigmoid to get the hidden activations. These are the learned features — the new coordinate system the hidden layer builds from the raw inputs.",
    insight: null,
    highlight: ["v1","v2","Z1","Z2"],
    stored: { "$v_1$": fmt(v1), "$v_2$": fmt(v2), "$Z_1$": fmt(Z1), "$Z_2$": fmt(Z2) }
  },
  {
    title: "Forward: Output & Loss",
    phase: "forward", phaseColor: "var(--blue)",
    tex: `f = ${W.b1}(${fmt(Z1)}) + (${W.b2})(${fmt(Z2)}) + ${W.b0} = ${fmt(f)}\\\\R = \\tfrac{1}{2}(${yTrue} - ${fmt(f)})^2 = ${fmt(R)}`,
    text: "Linear combination at the output (no activation — this is regression). Then compute the loss. Forward pass complete. We stored $v_1$, $v_2$, $Z_1$, $Z_2$, $f$ — all needed for the backward pass.",
    insight: null,
    highlight: ["Z1","Z2","f","R"],
    stored: { "$v_1$": fmt(v1), "$v_2$": fmt(v2), "$Z_1$": fmt(Z1), "$Z_2$": fmt(Z2), "$f$": fmt(f), "$R$": fmt(R) }
  },
  {
    title: "Backward: Output Error $\\delta$",
    phase: "backward", phaseColor: "var(--red)",
    tex: `\\delta = \\frac{\\partial R}{\\partial f} = -(y - f) = -(${yTrue} - ${fmt(f)}) = ${fmt(delta)}`,
    text: "Start at the loss and work backward. This single number $\\delta$ tells the output: 'you predicted " + fmt(f,3) + " but the truth was " + yTrue + "; you were off by " + fmt(yTrue-f,3) + ".' Everything downstream flows from this one value.",
    insight: "This is the ONLY new computation. Everything else is reuse + one local multiply.",
    highlight: ["R","f"],
    stored: { "$v_1$": fmt(v1), "$v_2$": fmt(v2), "$Z_1$": fmt(Z1), "$Z_2$": fmt(Z2), "$f$": fmt(f), "$R$": fmt(R), "$\\delta$": fmt(delta) }
  },
  {
    title: "Backward: Output Weight Gradients",
    phase: "backward", phaseColor: "var(--red)",
    tex: `\\frac{\\partial R}{\\partial \\beta_1} = \\delta \\cdot Z_1 = (${fmt(delta)})(${fmt(Z1)}) = ${fmt(dR_db1)}\\\\\\frac{\\partial R}{\\partial \\beta_2} = \\delta \\cdot Z_2 = (${fmt(delta)})(${fmt(Z2)}) = ${fmt(dR_db2)}\\\\\\frac{\\partial R}{\\partial \\beta_0} = \\delta = ${fmt(dR_db0)}`,
    text: "Gradients for the output weights. Notice the pattern: error $\\times$ input to this layer. $\\delta$ was already computed; $Z_1$ and $Z_2$ were stored during the forward pass. No new computation — just two multiplications.",
    insight: "Pattern: gradient = error signal $\\times$ input to that layer. This is the same as $\\partial R/\\partial \\beta = (y - \\hat{y}) \\cdot x$ in linear regression.",
    highlight: ["f","Z1","Z2"],
    stored: { "$v_1$": fmt(v1), "$v_2$": fmt(v2), "$Z_1$": fmt(Z1), "$Z_2$": fmt(Z2), "$\\delta$": fmt(delta), "$\\partial R/\\partial \\beta_1$": fmt(dR_db1), "$\\partial R/\\partial \\beta_2$": fmt(dR_db2) }
  },
  {
    title: "Backward: Hidden Error Signals",
    phase: "backward", phaseColor: "var(--red)",
    tex: `s_1 = \\sigma'(v_1) \\cdot \\beta_1 \\cdot \\delta = (${fmt(sigp(v1),4)})(${W.b1})(${fmt(delta)}) = ${fmt(s1,6)}\\\\s_2 = \\sigma'(v_2) \\cdot \\beta_2 \\cdot \\delta = (${fmt(sigp(v2),4)})(${W.b2})(${fmt(delta)}) = ${fmt(s2,6)}`,
    text: "Now the magic: propagate the error backward through the hidden layer. Three factors multiply together: (1) $\\sigma'(v)$ — how sensitive is the activation? (2) $\\beta$ — how much does this neuron influence the output? (3) $\\delta$ — the output error. All three were already computed or stored.",
    insight: "If ANY of these three factors is near zero, the gradient vanishes. $\\sigma'(v) \\leq 0.25$ for sigmoid — this is the vanishing gradient problem. After $L$ layers: $(0.25)^L$.",
    highlight: ["Z1","Z2","v1","v2"],
    stored: { "$v_1$": fmt(v1), "$v_2$": fmt(v2), "$Z_1$": fmt(Z1), "$Z_2$": fmt(Z2), "$\\delta$": fmt(delta), "$s_1$": fmt(s1,6), "$s_2$": fmt(s2,6) }
  },
  {
    title: "Backward: Input Weight Gradients",
    phase: "backward", phaseColor: "var(--red)",
    tex: `\\frac{\\partial R}{\\partial a_{11}} = s_1 \\cdot x_1 = ${fmt(s1,6)} \\cdot ${x1} = ${fmt(dR_da11,6)}\\\\\\frac{\\partial R}{\\partial a_{12}} = s_1 \\cdot x_2 = ${fmt(s1,6)} \\cdot ${x2} = ${fmt(dR_da12,6)}\\\\\\frac{\\partial R}{\\partial a_{21}} = s_2 \\cdot x_1 = ${fmt(dR_da21,6)}\\quad\\frac{\\partial R}{\\partial a_{22}} = s_2 \\cdot x_2 = ${fmt(dR_da22,6)}`,
    text: "Same pattern again: error signal $\\times$ input to that layer. The hidden error $s$ replaces the output error $\\delta$, and $x$ replaces $Z$. That's the whole algorithm — errors flow backward, gradients are local products.",
    insight: "Total cost: 1 forward pass + 1 backward pass. We got gradients for ALL 9 parameters. Finite differences would need 9 separate forward passes. For MNIST (235K params): 235K forward passes vs 2.",
    highlight: ["v1","v2","x1","x2"],
    stored: { "$\\delta$": fmt(delta), "$s_1$": fmt(s1,6), "$s_2$": fmt(s2,6), "$\\partial R/\\partial \\beta_1$": fmt(dR_db1), "$\\partial R/\\partial \\beta_2$": fmt(dR_db2), "$\\partial R/\\partial \\alpha_{11}$": fmt(dR_da11,6), "$\\partial R/\\partial \\alpha_{12}$": fmt(dR_da12,6), "$\\partial R/\\partial \\alpha_{21}$": fmt(dR_da21,6), "$\\partial R/\\partial \\alpha_{22}$": fmt(dR_da22,6) }
  }
];

let step = 0;

// ── Graph drawing ──
const canvas = document.getElementById("graph");
const ctx = canvas.getContext("2d");

const nodePositions = {
  x1: [80, 140], x2: [80, 360],
  v1: [300, 120], v2: [300, 380],
  Z1: [500, 120], Z2: [500, 380],
  f:  [720, 250],
  R:  [920, 250]
};

const edges = [
  ["x1","v1","a₁₁"], ["x2","v1","a₁₂"], ["x1","v2","a₂₁"], ["x2","v2","a₂₂"],
  ["v1","Z1","σ"], ["v2","Z2","σ"],
  ["Z1","f","β₁"], ["Z2","f","β₂"],
  ["f","R","loss"]
];

const nodeLabels = {
  x1: "x₁", x2: "x₂", v1: "v₁", v2: "v₂", Z1: "Z₁", Z2: "Z₂", f: "f", R: "R"
};

const nodeValues = {
  x1: x1, x2: x2, v1: v1, v2: v2, Z1: Z1, Z2: Z2, f: f, R: R
};

function getPhaseForNode(nodeId, currentStep) {
  const s = steps[currentStep];
  if (!s.highlight) return "dim";
  if (s.highlight.includes(nodeId)) return s.phase || "setup";
  // Check if node was highlighted in a previous step
  for (let i = currentStep - 1; i >= 0; i--) {
    if (steps[i].highlight && steps[i].highlight.includes(nodeId)) return "past";
  }
  return "dim";
}

function drawGraph() {
  const dpr = window.devicePixelRatio || 1;
  const W = canvas.clientWidth;
  const H = canvas.clientHeight || 500;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, W, H);

  const scaleX = W / 1000;
  const scaleY = H / 500;
  const sc = (pos) => [pos[0] * scaleX, pos[1] * scaleY];
  const r = Math.min(32 * scaleX, 32 * scaleY);

  const s = steps[step];
  const isBackward = s.phase === "backward";

  // ── Canvas: edges only ──
  for (const [from, to, label] of edges) {
    const [x1e, y1e] = sc(nodePositions[from]);
    const [x2e, y2e] = sc(nodePositions[to]);
    const fromPhase = getPhaseForNode(from, step);
    const toPhase = getPhaseForNode(to, step);
    const active = fromPhase !== "dim" && toPhase !== "dim";

    ctx.beginPath();
    ctx.moveTo(x1e, y1e);
    ctx.lineTo(x2e, y2e);
    ctx.strokeStyle = active ? (isBackward ? "#c0392b55" : "#2471a355") : "#d4cbbe44";
    ctx.lineWidth = active ? 3 : 1.5;
    ctx.stroke();
  }

  // ── Canvas: backward flow dashes ──
  if (isBackward) {
    ctx.strokeStyle = "#c0392baa";
    ctx.lineWidth = 3;
    ctx.setLineDash([8, 5]);
    const path = [sc(nodePositions.R), sc(nodePositions.f), sc(nodePositions.Z1), sc(nodePositions.v1)];
    const path2 = [sc(nodePositions.f), sc(nodePositions.Z2), sc(nodePositions.v2)];
    ctx.beginPath();
    for (let i = 0; i < path.length - 1; i++) {
      ctx.moveTo(path[i][0], path[i][1] + 55 * scaleY);
      ctx.lineTo(path[i+1][0], path[i+1][1] + 55 * scaleY);
    }
    for (let i = 0; i < path2.length - 1; i++) {
      ctx.moveTo(path2[i][0], path2[i][1] + 55 * scaleY);
      ctx.lineTo(path2[i+1][0], path2[i+1][1] + 55 * scaleY);
    }
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // ── Canvas: node circles only ──
  for (const [id, pos] of Object.entries(nodePositions)) {
    const [cx, cy] = sc(pos);
    const phase = getPhaseForNode(id, step);

    let fillColor, strokeColor;
    if (phase === "setup") { fillColor = "#b35c1e22"; strokeColor = "#b35c1e"; }
    else if (phase === "forward") { fillColor = "#2471a322"; strokeColor = "#2471a3"; }
    else if (phase === "backward") { fillColor = "#c0392b22"; strokeColor = "#c0392b"; }
    else if (phase === "past") { fillColor = "#1a7a5a15"; strokeColor = "#1a7a5a88"; }
    else { fillColor = "#f5f0e8"; strokeColor = "#d4cbbe"; }

    // Glow
    if (phase === "forward" || phase === "backward" || phase === "setup") {
      ctx.beginPath();
      ctx.arc(cx, cy, r * 2, 0, Math.PI * 2);
      const grd = ctx.createRadialGradient(cx, cy, r * 0.5, cx, cy, r * 2);
      grd.addColorStop(0, (phase === "backward" ? "#c0392b" : phase === "forward" ? "#2471a3" : "#b35c1e") + "22");
      grd.addColorStop(1, "transparent");
      ctx.fillStyle = grd;
      ctx.fill();
    }

    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fillStyle = fillColor;
    ctx.fill();
    ctx.strokeStyle = strokeColor;
    ctx.lineWidth = (phase !== "dim" && phase !== "past") ? 3.5 : 2;
    ctx.stroke();
  }

  // ── HTML overlays with KaTeX ──
  const overlays = document.getElementById("overlays");
  overlays.innerHTML = "";

  function addLabel(x, y, tex, color, fontSize, anchorX, anchorY) {
    const pctX = (x / W) * 100;
    const pctY = (y / H) * 100;
    const div = document.createElement("div");
    div.style.cssText = `position:absolute; left:${pctX}%; top:${pctY}%; transform:translate(${anchorX}, ${anchorY}); font-size:${fontSize}px; color:${color}; white-space:nowrap;`;
    try { katex.render(tex, div, { displayMode: false, throwOnError: false }); }
    catch(e) { div.textContent = tex; }
    overlays.appendChild(div);
  }

  // Node labels (inside circles)
  const nodeTexLabels = {
    x1: "x_1", x2: "x_2", v1: "v_1", v2: "v_2",
    Z1: "Z_1", Z2: "Z_2", f: "f", R: "R"
  };
  for (const [id, pos] of Object.entries(nodePositions)) {
    const [cx, cy] = sc(pos);
    const phase = getPhaseForNode(id, step);
    let color;
    if (phase === "setup") color = "#b35c1e";
    else if (phase === "forward") color = "#2471a3";
    else if (phase === "backward") color = "#c0392b";
    else if (phase === "past") color = "#1a7a5a";
    else color = "#bbb";
    addLabel(cx, cy, nodeTexLabels[id], color, 16, "-50%", "-50%");
  }

  // Node values (below circles)
  for (const [id, pos] of Object.entries(nodePositions)) {
    const [cx, cy] = sc(pos);
    const phase = getPhaseForNode(id, step);
    if (phase === "dim") continue;
    const val = nodeValues[id];
    if (val === undefined) continue;
    let color = phase === "backward" ? "#c0392b" : phase === "past" ? "#1a7a5a" : "#2c2418";
    addLabel(cx, cy + r + 16 * scaleY, fmt(val, 3), color, 18, "-50%", "0");
  }

  // Edge labels
  const edgeTexLabels = {
    "a₁₁": "\\alpha_{11}", "a₁₂": "\\alpha_{12}", "a₂₁": "\\alpha_{21}", "a₂₂": "\\alpha_{22}",
    "σ": "\\sigma", "β₁": "\\beta_1", "β₂": "\\beta_2", "loss": "\\mathcal{L}"
  };
  for (const [from, to, label] of edges) {
    const [x1e, y1e] = sc(nodePositions[from]);
    const [x2e, y2e] = sc(nodePositions[to]);
    const fromPhase = getPhaseForNode(from, step);
    const toPhase = getPhaseForNode(to, step);
    const active = fromPhase !== "dim" && toPhase !== "dim";

    const mx = (x1e + x2e) / 2;
    const my = (y1e + y2e) / 2;
    // Offset label perpendicular to the edge to avoid overlap
    const dx = x2e - x1e, dy = y2e - y1e;
    const len = Math.sqrt(dx*dx + dy*dy) || 1;
    const nx = -dy / len, ny = dx / len;
    const offsetDist = 24 * Math.min(scaleX, scaleY);
    const lx = mx + nx * offsetDist;
    const ly = my + ny * offsetDist;

    const tex = edgeTexLabels[label] || label;
    const color = active ? "#2c2418" : "#bbb";
    addLabel(lx, ly, tex, color, 18, "-50%", "-50%");
  }

  // Layer headers
  const headers = [
    [nodePositions.x1[0], "\\text{Input}"],
    [nodePositions.v1[0], "\\text{Pre-activation}"],
    [nodePositions.Z1[0], "\\text{Hidden}"],
    [nodePositions.f[0], "\\text{Output}"],
    [nodePositions.R[0], "\\text{Loss}"]
  ];
  for (const [xPos, tex] of headers) {
    const [px] = sc([xPos, 0]);
    addLabel(px, 10 * scaleY, tex, "#7a7060", 18, "-50%", "0");
  }

  // Backward flow label
  if (isBackward) {
    const [fx, fy] = sc(nodePositions.f);
    addLabel(fx, fy + 95 * scaleY, "\\boldsymbol{\\leftarrow} \\textbf{ errors flow backward}", "#c0392b", 22, "-50%", "0");
  }
}

// ── Detail panel ──
function renderDetail() {
  const s = steps[step];
  const el = document.getElementById("detail");

  const phaseLabel = s.phase === "forward" ? "FORWARD PASS" : s.phase === "backward" ? "BACKWARD PASS" : "SETUP";
  const phaseColor = s.phase === "forward" ? "var(--blue)" : s.phase === "backward" ? "var(--red)" : "var(--accent)";
  el.style.borderLeftColor = phaseColor;

  let html = `<h2 style="color:${phaseColor}">${s.title}<span class="phase-badge" style="background:${phaseColor}22;color:${phaseColor}">${phaseLabel}</span></h2>`;
  html += `<div class="math-block" style="border-left-color:${phaseColor}"><span id="step-math"></span></div>`;
  html += `<p>${s.text}</p>`;
  if (s.insight) {
    html += `<div class="insight"><strong>Note:</strong> ${s.insight}</div>`;
  }
  el.innerHTML = html;
  katex.render(s.tex, document.getElementById("step-math"), { displayMode: true });
  renderMathInElement(el, {
    delimiters: [
      { left: "$$", right: "$$", display: true },
      { left: "$", right: "$", display: false },
    ],
    throwOnError: false,
  });
}

// ── Stored values panel ──
function renderStored() {
  const s = steps[step];
  const el = document.getElementById("stored");
  const prev = step > 0 ? steps[step - 1].stored : {};

  let html = `<div class="stored-title">${s.phase === "backward" ? "Stored values + computed gradients" : "Stored values (needed for backward pass)"}</div>`;

  for (const [k, v] of Object.entries(s.stored)) {
    const isNew = !(k in prev);
    const isGrad = k.includes('\\partial') || k.includes('\\delta') || k.includes('s_');
    const hlCls = isNew ? (isGrad ? 'highlight-back' : 'highlight') : '';
    html += `<div class="item ${hlCls}"><span class="lbl">${k}</span><span class="val ${isNew ? (isGrad ? 'back' : 'new') : ''}">${v}</span></div>`;
  }
  if (Object.keys(s.stored).length === 0) {
    html += `<div class="item"><span class="lbl" style="grid-column:1/-1;text-align:center;">No values stored yet</span></div>`;
  }
  el.innerHTML = html;
  renderMathInElement(el, {
    delimiters: [
      { left: "$$", right: "$$", display: true },
      { left: "$", right: "$", display: false },
    ],
    throwOnError: false,
  });
}

// ── Step dots ──
function renderDots() {
  const el = document.getElementById("dots");
  const groups = [
    { label: "", cls: "", indices: [0] },
    { label: "Forward", cls: "fwd", indices: [1, 2, 3] },
    { label: "Backward", cls: "bwd", indices: [4, 5, 6, 7] },
  ];
  let html = "";
  for (let g = 0; g < groups.length; g++) {
    if (g > 0) html += `<span class="step-sep">›</span>`;
    const grp = groups[g];
    html += `<div class="step-group">`;
    html += `<div class="step-group-label ${grp.cls}">${grp.label}</div>`;
    html += `<div class="step-group-dots">`;
    for (const i of grp.indices) {
      const s = steps[i];
      const cls = s.phase === "forward" ? "forward" : s.phase === "backward" ? "backward" : "";
      html += `<div class="step-dot ${cls} ${i === step ? 'active' : ''}" onclick="goTo(${i})">${i}</div>`;
    }
    html += `</div></div>`;
  }
  el.innerHTML = html;
}

function renderAll() {
  drawGraph();
  renderDetail();
  renderStored();
  renderDots();
  document.getElementById("prev").disabled = step === 0;
  document.getElementById("next").disabled = step === steps.length - 1;
}

function goTo(i) { step = i; renderAll(); }
document.getElementById("prev").onclick = () => { if (step > 0) { step--; renderAll(); } };
document.getElementById("next").onclick = () => { if (step < steps.length - 1) { step++; renderAll(); } };

renderAll();
window.addEventListener("resize", drawGraph);
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight" || e.key === "ArrowDown") { e.preventDefault(); if (step < steps.length - 1) { step++; renderAll(); } }
  if (e.key === "ArrowLeft" || e.key === "ArrowUp") { e.preventDefault(); if (step > 0) { step--; renderAll(); } }
});
</script>
</body>
</html>
